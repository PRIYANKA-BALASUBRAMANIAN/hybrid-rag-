[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    integration: end-to-end API tests (offline providers)
    model: real-model tests, gated behind RUN_MODEL_TESTS=1
filterwarnings =
    ignore::UserWarning:qdrant_client.*
    ignore::DeprecationWarning:pymupdf.*
