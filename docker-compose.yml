# =============================================================================
# Full stack: Qdrant server + FastAPI backend + Streamlit frontend.
#
#   docker compose up --build
#     frontend : http://localhost:8501
#     API docs : http://localhost:8000/docs
#
# Requires a `.env` file next to this compose file (copy .env.example).
# The compose environment forces Qdrant server mode regardless of what your
# local .env says about modes/paths.
# =============================================================================
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC (optional)
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build: .
    env_file: .env
    environment:
      # Inside the compose network the vector DB is the `qdrant` service.
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    volumes:
      - app_data:/srv/app/data   # uploads + embedding cache persist here

  frontend:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8501:8501"

volumes:
  qdrant_storage:
  app_data:
